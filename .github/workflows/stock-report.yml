name: Daily Stock Report

on:
  schedule:
    - cron: '30 23 * * 0-4'  # 07:30 Taiwan time, Mon-Fri
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup Claude credentials
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          mkdir -p ~/.claude
          printf '%s' "$CLAUDE_CREDENTIALS" > ~/.claude/.credentials.json

      - name: Install dependencies
        run: pip install requests

      - name: Run stock report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK }}
        run: python stock_report.py
