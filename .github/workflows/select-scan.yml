name: select-scan
on:
  schedule:
    - cron: '45 16 * * 0-4'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python select_scan.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/select_scan.json
          git diff --staged --quiet || git commit -m "select-scan $(date -u +%F)"
          git push
